version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: creatoros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creatoros_user
      POSTGRES_PASSWORD: creatoros_secure_password
      POSTGRES_DB: creatoros_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatoros_user -d creatoros_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
